<!DOCTYPE html>
<html>

<head>
    <title>My Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="hero">

        <h1>My Cafe</h1>

        <p>Welcome to our cafe!</p>

        <p class="intro">
            Freshly made coffee, tea and cold drinks. Order below and we'll get started.
        </p>

    </section>

    <form id="orderForm">

        <div class="field">
            <label for="username">Name</label>
            <input type="text" id="username" placeholder="Your name" required>
        </div>

        <div class="field">
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="Your age" min="1" max="120" required>
        </div>

        <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Choose one</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="field">
            <label for="orderType">Order type</label>
            <select id="orderType" required>
                <option value="">Choose one</option>
                <option value="Coffee">Coffee</option>
                <option value="Tea">Tea</option>
                <option value="Hot chocolate">Hot chocolate</option>
                <option value="Juice">Juice</option>
            </select>
        </div>

        <fieldset class="field">

            <legend>Do you want it hot or cold?</legend>

            <label class="radio">
                <input type="radio" name="temperature" value="hot" checked> Hot
            </label>

            <label class="radio">
                <input type="radio" name="temperature" value="cold"> Cold
            </label>

        </fieldset>

        <button type="submit">Order Drink</button>

    </form>

    <div id="orderDetails"></div>

    <script src="app.js"></script>

</body>

</html>
