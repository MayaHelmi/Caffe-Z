<!DOCTYPE html>
<html>

<head>
    <title>My Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- hero section -->
    <section class="hero">

        <h1>My Cafe</h1>

        <p>Welcome to our cafe!</p>

        <p class="intro">
            My Cafe is a small ordering page built with HTML, CSS, and JavaScript.
            Click the button below and answer a few quick questions — your name, your
            gender, and whether you want a hot or cold drink — and we will prepare your
            order and show it right here on the page.
        </p>

        <button onclick="order()">
            Order Drink
        </button>

    </section>

    <div id="orderDetails"></div>

    <script src="app.js"></script>

</body>

</html>
